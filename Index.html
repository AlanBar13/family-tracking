<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --papel: #eef1f0;
    --tarjeta: #ffffff;
    --tinta: #15211e;
    --suave: #5e6d68;
    --linea: #d9dedc;
    --acento: #10716b;
    --peligro: #a8402c;
    --radio: 14px;
    --sombra: 0 1px 2px rgba(21, 33, 30, .06), 0 6px 18px rgba(21, 33, 30, .05);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--papel);
    color: var(--tinta);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    padding-bottom: calc(86px + env(safe-area-inset-bottom));
  }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- encabezado ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--papel);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--linea);
  }
  .mes { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mes strong { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .mes button {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--linea); background: var(--tarjeta);
    display: grid; place-items: center; font-size: 17px; color: var(--suave);
  }
  .mes button:disabled { opacity: .3; }
  .quien { margin-top: 2px; font-size: 13px; color: var(--suave); }

  main { padding: 16px; max-width: 560px; margin: 0 auto; }

  /* ---------- total del mes ---------- */
  .total { margin: 4px 0 22px; }
  .total .cifra {
    font-size: clamp(38px, 12vw, 52px); font-weight: 650;
    letter-spacing: -.035em; line-height: 1;
  }
  .total .pie { margin-top: 6px; font-size: 13px; color: var(--suave); }
  .espectro { display: flex; height: 10px; border-radius: 99px; overflow: hidden; margin-top: 14px; background: var(--linea); }
  .espectro span { height: 100%; }

  /* ---------- gráficas ---------- */
  .bloque { background: var(--tarjeta); border-radius: var(--radio); box-shadow: var(--sombra); padding: 16px; margin-bottom: 14px; }
  .bloque h2 { margin: 0 0 14px; font-size: 14px; font-weight: 600; color: var(--suave); }
  .barra { margin-bottom: 13px; }
  .barra:last-child { margin-bottom: 0; }
  .barra .fila { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-bottom: 5px; }
  .barra .fila span:last-child { color: var(--suave); white-space: nowrap; }
  .pista { height: 8px; background: var(--papel); border-radius: 99px; overflow: hidden; }
  .pista i { display: block; height: 100%; border-radius: 99px; }

  /* ---------- lista ---------- */
  .dia { font-size: 13px; color: var(--suave); margin: 18px 2px 8px; }
  .gasto {
    width: 100%; text-align: left; background: var(--tarjeta); border: none;
    border-radius: var(--radio); box-shadow: var(--sombra);
    padding: 13px 15px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px;
  }
  .gasto .punto { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .gasto .cuerpo { flex: 1; min-width: 0; }
  .gasto .titulo { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gasto .meta { font-size: 12.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gasto .monto { font-weight: 600; white-space: nowrap; }

  .vacio { text-align: center; color: var(--suave); padding: 44px 20px; }
  .vacio p { margin: 0 0 4px; }

  /* ---------- navegación ---------- */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: rgba(238, 241, 240, .94);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--linea);
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 8px;
  }
  nav .pestanas { display: flex; background: var(--linea); border-radius: 99px; padding: 3px; flex: none; }
  nav .pestanas button {
    border: none; background: none; border-radius: 99px;
    padding: 7px 14px; font-size: 14px; color: var(--suave);
  }
  nav .pestanas button[aria-selected="true"] { background: var(--tarjeta); color: var(--tinta); font-weight: 600; }
  .nuevo {
    flex: 1; border: none; background: var(--acento); color: #fff;
    border-radius: 99px; padding: 13px; font-weight: 600;
  }

  /* ---------- formulario ---------- */
  .panel {
    position: fixed; inset: 0; z-index: 40; background: var(--papel);
    overflow-y: auto; display: none;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .panel.abierto { display: block; }
  .panel .interno { max-width: 560px; margin: 0 auto; }
  .panel h1 { font-size: 20px; font-weight: 600; margin: 0 0 18px; letter-spacing: -.01em; }
  .campo { margin-bottom: 15px; }
  .campo label { display: block; font-size: 13px; color: var(--suave); margin-bottom: 6px; }
  .campo input, .campo select, .campo textarea {
    width: 100%; font: inherit; color: inherit; background: var(--tarjeta);
    border: 1px solid var(--linea); border-radius: 11px; padding: 12px 13px;
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus,
  button:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
  #monto { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .fichas { display: flex; flex-wrap: wrap; gap: 7px; }
  .fichas button {
    border: 1px solid var(--linea); background: var(--tarjeta);
    border-radius: 99px; padding: 8px 14px; font-size: 14px;
  }
  .fichas button[aria-pressed="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }
  .acciones { display: flex; gap: 10px; margin-top: 22px; }
  .acciones button { flex: 1; border-radius: 11px; padding: 14px; font-weight: 600; border: 1px solid var(--linea); background: var(--tarjeta); }
  .acciones .guardar { background: var(--acento); color: #fff; border-color: var(--acento); }
  .acciones button:disabled { opacity: .5; }
  .borrar { width: 100%; margin-top: 12px; background: none; border: none; color: var(--peligro); padding: 12px; font-size: 14px; }

  .escaner {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 1px dashed var(--linea); background: var(--tarjeta);
    border-radius: 11px; padding: 14px; margin-bottom: 20px; font-weight: 600;
  }
  .escaner svg { flex: none; color: var(--acento); }
  .escaner small { display: block; font-weight: 400; color: var(--suave); font-size: 12.5px; margin-top: 1px; }
  .escaner:disabled { opacity: .6; }
  #archivoTicket { display: none; }

  .aviso { background: #fdeceA; color: var(--peligro); border-radius: 11px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }

  @media (prefers-color-scheme: dark) {
    :root {
      --papel: #131817; --tarjeta: #1d2423; --tinta: #e8edeb;
      --suave: #96a49f; --linea: #2c3634; --acento: #37a89f; --peligro: #e08472;
      --sombra: none;
    }
    nav { background: rgba(19, 24, 23, .94); }
    .aviso { background: #3a2320; }
    .fichas button[aria-pressed="true"] { background: var(--acento); color: #06211f; border-color: var(--acento); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="mes">
    <button id="anterior" aria-label="Mes anterior">‹</button>
    <div style="text-align:center">
      <strong id="etiquetaMes">Cargando…</strong>
      <div class="quien" id="quien"></div>
    </div>
    <button id="siguiente" aria-label="Mes siguiente">›</button>
  </div>
</header>

<main id="contenido">
  <div class="vacio">Cargando gastos…</div>
</main>

<nav>
  <div class="pestanas" role="tablist">
    <button role="tab" data-vista="resumen" aria-selected="true">Resumen</button>
    <button role="tab" data-vista="lista" aria-selected="false">Gastos</button>
  </div>
  <button class="nuevo" id="abrirNuevo">Nuevo gasto</button>
</nav>

<section class="panel" id="panel" aria-hidden="true">
  <div class="interno">
    <h1 id="tituloPanel">Nuevo gasto</h1>
    <div class="aviso" id="avisoForma" style="display:none"></div>

    <button class="escaner" id="botonEscaner" type="button">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 8.6A1.6 1.6 0 0 1 4.6 7h2.1l1.1-2h8.4l1.1 2h2.1A1.6 1.6 0 0 1 21 8.6v8.8a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 17.4z"/>
        <circle cx="12" cy="13" r="3.5"/>
      </svg>
      <span>Escanear ticket<small id="pieEscaner">Toma la foto y se llenan los campos</small></span>
    </button>
    <input type="file" id="archivoTicket" accept="image/*" capture="environment">

    <div class="campo">
      <label for="monto">Monto</label>
      <input id="monto" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
    </div>
    <div class="campo">
      <label for="nombre">Nombre del gasto</label>
      <input id="nombre" type="text" placeholder="Súper de la semana" autocomplete="off">
    </div>
    <div class="campo">
      <label for="fecha">Fecha</label>
      <input id="fecha" type="date">
    </div>
    <div class="campo">
      <label for="categoria">Categoría</label>
      <select id="categoria"></select>
    </div>
    <div class="campo">
      <label>Tipo de pago</label>
      <div class="fichas" id="fichasPago"></div>
    </div>
    <div class="campo">
      <label for="notas">Notas (opcional)</label>
      <textarea id="notas" rows="2"></textarea>
    </div>

    <div class="acciones">
      <button id="cancelar">Cancelar</button>
      <button class="guardar" id="guardar">Guardar gasto</button>
    </div>
    <button class="borrar" id="borrar" style="display:none">Borrar este gasto</button>
  </div>
</section>

<script>
var PALETA = ['#10716b','#2e5eaa','#c1666b','#e8a33d','#6a7fdb','#4c956c','#9b5de5','#a15c2b','#7a8b99','#d67ba0','#3f8f7a','#b08968'];
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

var estado = null;
var vista = 'resumen';
var editando = null;
var pagoElegido = '';
var ocupado = false;

var dinero = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2 });
var dineroCorto = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });

function $(id) { return document.getElementById(id); }
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

function servidor(fn, args) {
  return new Promise(function (ok, mal) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { mal(e); });
    r[fn].apply(r, args || []);
  });
}

/* ------------------------------------------------------------ agrupaciones */

function acumular(gastos, clave) {
  var mapa = {};
  gastos.forEach(function (g) {
    var k = clave(g) || 'Sin especificar';
    mapa[k] = (mapa[k] || 0) + g.monto;
  });
  return Object.keys(mapa)
    .map(function (k) { return { etiqueta: k, total: mapa[k] }; })
    .sort(function (a, b) { return b.total - a.total; });
}

function nombreDe(correo) {
  var p = (estado.config.personas || []).filter(function (x) { return x.correo === correo; })[0];
  return p ? p.nombre : (correo || '').split('@')[0];
}

function colorCategoria(nombre) {
  var i = estado.config.categorias.indexOf(nombre);
  if (i === -1) i = estado.config.categorias.length;
  return PALETA[i % PALETA.length];
}

/* ------------------------------------------------------------------ pintar */

function barras(titulo, datos, total, color) {
  if (!datos.length) return '';
  var maximo = datos[0].total || 1;
  var filas = datos.map(function (d, i) {
    var pct = total ? Math.round(d.total / total * 100) : 0;
    var c = typeof color === 'function' ? color(d.etiqueta, i) : color;
    return '<div class="barra">' +
      '<div class="fila"><span>' + esc(d.etiqueta) + '</span>' +
      '<span class="num">' + dinero.format(d.total) + ' · ' + pct + '%</span></div>' +
      '<div class="pista"><i style="width:' + Math.max(d.total / maximo * 100, 2) + '%;background:' + c + '"></i></div>' +
      '</div>';
  }).join('');
  return '<div class="bloque"><h2>' + titulo + '</h2>' + filas + '</div>';
}

function pintarResumen(gastos) {
  var total = gastos.reduce(function (s, g) { return s + g.monto; }, 0);
  if (!gastos.length) {
    return '<div class="vacio"><p>Todavía no hay gastos en este mes.</p><p>Agrega el primero con el botón de abajo.</p></div>';
  }

  var porCategoria = acumular(gastos, function (g) { return g.categoria; });
  var espectro = porCategoria.map(function (d) {
    return '<span style="width:' + (d.total / total * 100) + '%;background:' + colorCategoria(d.etiqueta) + '"></span>';
  }).join('');

  var html = '<div class="total">' +
    '<div class="cifra num">' + dinero.format(total) + '</div>' +
    '<div class="pie">' + gastos.length + (gastos.length === 1 ? ' gasto' : ' gastos') +
    ' · promedio ' + dineroCorto.format(total / gastos.length) + '</div>' +
    '<div class="espectro">' + espectro + '</div></div>';

  html += barras('Por categoría', porCategoria, total, function (n) { return colorCategoria(n); });
  html += barras('Por tipo de pago', acumular(gastos, function (g) { return g.tipoPago; }), total, 'var(--acento)');
  html += barras('Por persona', acumular(gastos, function (g) { return nombreDe(g.autor); }), total, function (n, i) { return PALETA[(i * 4 + 1) % PALETA.length]; });
  return html;
}

function pintarLista(gastos) {
  if (!gastos.length) {
    return '<div class="vacio"><p>Sin movimientos este mes.</p></div>';
  }
  var html = '', ultimoDia = '';
  gastos.forEach(function (g) {
    if (g.fecha !== ultimoDia) {
      ultimoDia = g.fecha;
      var p = g.fecha.split('-');
      var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      html += '<div class="dia">' + DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()] + '</div>';
    }
    html += '<button class="gasto" data-id="' + g.id + '">' +
      '<i class="punto" style="background:' + colorCategoria(g.categoria) + '"></i>' +
      '<span class="cuerpo">' +
        '<span class="titulo">' + esc(g.nombre) + '</span>' +
        '<span class="meta">' + esc(g.categoria) + ' · ' + esc(g.tipoPago) + ' · ' + esc(nombreDe(g.autor)) + '</span>' +
      '</span>' +
      '<span class="monto num">' + dinero.format(g.monto) + '</span>' +
      '</button>';
  });
  return html;
}

function pintar() {
  if (!estado) return;
  var p = estado.mes.split('-');
  $('etiquetaMes').textContent = MESES[Number(p[1]) - 1].replace(/^./, function (c) { return c.toUpperCase(); }) + ' ' + p[0];
  $('quien').textContent = 'Capturando como ' + estado.usuario.nombre;

  var hoyMes = estado.hoy.slice(0, 7);
  $('siguiente').disabled = estado.mes >= hoyMes;

  $('contenido').innerHTML = vista === 'resumen' ? pintarResumen(estado.gastos) : pintarLista(estado.gastos);

  Array.prototype.forEach.call(document.querySelectorAll('.gasto'), function (b) {
    b.addEventListener('click', function () { abrirPanel(b.getAttribute('data-id')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[role="tab"]'), function (b) {
    b.setAttribute('aria-selected', b.getAttribute('data-vista') === vista ? 'true' : 'false');
  });
}

/* ------------------------------------------------------------------ cargar */

function aplicar(nuevo) {
  estado = nuevo;
  llenarOpciones();
  pintar();
}

function cargar(mes) {
  $('contenido').innerHTML = '<div class="vacio">Cargando gastos…</div>';
  servidor('obtenerEstado', [mes || ''])
    .then(aplicar)
    .catch(function (e) {
      $('contenido').innerHTML = '<div class="aviso">' + esc(e.message || e) + '</div>';
    });
}

function moverMes(delta) {
  var p = estado.mes.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
  cargar(d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2));
}

/* -------------------------------------------------------------- formulario */

function llenarOpciones() {
  var sel = $('categoria');
  var actual = sel.value;
  sel.innerHTML = estado.config.categorias.map(function (c) {
    return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
  }).join('');
  if (actual) sel.value = actual;

  $('fichasPago').innerHTML = estado.config.tiposPago.map(function (t) {
    return '<button type="button" data-pago="' + esc(t) + '" aria-pressed="false">' + esc(t) + '</button>';
  }).join('');
  Array.prototype.forEach.call($('fichasPago').children, function (b) {
    b.addEventListener('click', function () { elegirPago(b.getAttribute('data-pago')); });
  });
  elegirPago(pagoElegido || estado.config.tiposPago[0] || '');
}

function elegirPago(valor) {
  pagoElegido = valor;
  Array.prototype.forEach.call($('fichasPago').children, function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-pago') === valor ? 'true' : 'false');
  });
}

function abrirPanel(id) {
  editando = id ? estado.gastos.filter(function (g) { return g.id === id; })[0] : null;
  $('avisoForma').style.display = 'none';
  $('pieEscaner').textContent = PIE_ESCANER;
  $('tituloPanel').textContent = editando ? 'Editar gasto' : 'Nuevo gasto';
  $('guardar').textContent = editando ? 'Guardar cambios' : 'Guardar gasto';
  $('borrar').style.display = editando ? 'block' : 'none';

  $('monto').value = editando ? String(editando.monto) : '';
  $('nombre').value = editando ? editando.nombre : '';
  $('fecha').value = editando ? editando.fecha : (estado.mes === estado.hoy.slice(0, 7) ? estado.hoy : estado.mes + '-01');
  $('categoria').value = editando ? editando.categoria : estado.config.categorias[0] || '';
  $('notas').value = editando ? editando.notas : '';
  elegirPago(editando ? editando.tipoPago : estado.config.tiposPago[0] || '');

  $('panel').classList.add('abierto');
  $('panel').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  if (!editando) setTimeout(function () { $('monto').focus(); }, 60);
}

function cerrarPanel() {
  $('panel').classList.remove('abierto');
  $('panel').setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  editando = null;
}

function errorForma(mensaje) {
  var a = $('avisoForma');
  a.textContent = mensaje;
  a.style.display = 'block';
  a.scrollIntoView({ block: 'nearest' });
}

function bloquear(si, texto) {
  ocupado = si;
  $('guardar').disabled = si;
  $('borrar').disabled = si;
  $('cancelar').disabled = si;
  if (texto) $('guardar').textContent = texto;
}

function guardar() {
  if (ocupado) return;
  var datos = {
    id: editando ? editando.id : '',
    nombre: $('nombre').value,
    monto: parseFloat(String($('monto').value).replace(/[^0-9.]/g, '')),
    fecha: $('fecha').value,
    categoria: $('categoria').value,
    tipoPago: pagoElegido,
    notas: $('notas').value
  };
  if (!datos.nombre.trim()) return errorForma('Ponle un nombre al gasto.');
  if (!(datos.monto > 0)) return errorForma('El monto debe ser mayor a cero.');
  if (!datos.fecha) return errorForma('Elige la fecha del gasto.');

  var etiqueta = editando ? 'Guardar cambios' : 'Guardar gasto';
  bloquear(true, 'Guardando…');
  servidor(editando ? 'actualizarGasto' : 'agregarGasto', [datos])
    .then(function (nuevo) {
      bloquear(false, etiqueta);
      cerrarPanel();
      aplicar(nuevo);
    })
    .catch(function (e) {
      bloquear(false, etiqueta);
      errorForma(e.message || String(e));
    });
}

function borrar() {
  if (ocupado || !editando) return;
  if (!confirm('¿Borrar "' + editando.nombre + '"? No se puede deshacer.')) return;
  bloquear(true, 'Guardando…');
  servidor('borrarGasto', [editando.id, estado.mes])
    .then(function (nuevo) {
      bloquear(false, 'Guardar gasto');
      cerrarPanel();
      aplicar(nuevo);
    })
    .catch(function (e) {
      bloquear(false, 'Guardar cambios');
      errorForma(e.message || String(e));
    });
}

/* --------------------------------------------------------- lector de ticket */

var PIE_ESCANER = 'Toma la foto y se llenan los campos';

function comprimir(archivo) {
  return new Promise(function (ok, mal) {
    var lector = new FileReader();
    lector.onerror = function () { mal(new Error('No pude leer la foto.')); };
    lector.onload = function () {
      var img = new Image();
      img.onerror = function () { mal(new Error('Esa imagen no se pudo abrir.')); };
      img.onload = function () {
        var escala = Math.min(1, 1280 / Math.max(img.width, img.height));
        var lienzo = document.createElement('canvas');
        lienzo.width = Math.round(img.width * escala);
        lienzo.height = Math.round(img.height * escala);
        var ctx = lienzo.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, lienzo.width, lienzo.height);
        ctx.drawImage(img, 0, 0, lienzo.width, lienzo.height);
        ok(lienzo.toDataURL('image/jpeg', 0.72).split(',')[1]);
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

function estadoEscaner(cargando, texto) {
  ocupado = cargando;
  $('botonEscaner').disabled = cargando;
  $('guardar').disabled = cargando;
  $('pieEscaner').textContent = texto || PIE_ESCANER;
}

function escanear(archivo) {
  if (!archivo || ocupado) return;
  $('avisoForma').style.display = 'none';
  estadoEscaner(true, 'Leyendo el ticket…');
  comprimir(archivo)
    .then(function (base64) { return servidor('leerTicket', [base64]); })
    .then(function (r) {
      estadoEscaner(false, r.aviso);
      if (r.monto) $('monto').value = String(r.monto);
      if (r.nombre) $('nombre').value = r.nombre;
      if (r.fecha) $('fecha').value = r.fecha;
      if (r.categoria) $('categoria').value = r.categoria;
      if (r.tipoPago) elegirPago(r.tipoPago);
      $('nombre').focus();
    })
    .catch(function (e) {
      estadoEscaner(false, '');
      errorForma(e.message || String(e));
    });
}

/* ------------------------------------------------------------------ eventos */

$('anterior').addEventListener('click', function () { moverMes(-1); });
$('siguiente').addEventListener('click', function () { moverMes(1); });
$('abrirNuevo').addEventListener('click', function () { abrirPanel(null); });
$('botonEscaner').addEventListener('click', function () { $('archivoTicket').click(); });
$('archivoTicket').addEventListener('change', function () {
  escanear(this.files && this.files[0]);
  this.value = '';
});
$('cancelar').addEventListener('click', cerrarPanel);
$('guardar').addEventListener('click', guardar);
$('borrar').addEventListener('click', borrar);
Array.prototype.forEach.call(document.querySelectorAll('[role="tab"]'), function (b) {
  b.addEventListener('click', function () { vista = b.getAttribute('data-vista'); pintar(); });
});

cargar('');
