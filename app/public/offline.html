<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Sin conexión · Gastos de la casa</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { --papel:#eef1f0; --tarjeta:#fff; --tinta:#15211e; --suave:#5e6d68; --linea:#d9dedc; --acento:#10716b; }
      @media (prefers-color-scheme: dark) {
        :root { --papel:#131817; --tarjeta:#1d2423; --tinta:#e8edeb; --suave:#96a49f; --linea:#2c3634; --acento:#37a89f; }
      }
      body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:16px;
        background:var(--papel); color:var(--tinta);
        font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
      main { max-width:22rem; text-align:center; background:var(--tarjeta); border:1px solid var(--linea);
        border-radius:14px; padding:28px 24px; }
      h1 { margin:0 0 8px; font-size:1.25rem; }
      p { margin:0 0 20px; color:var(--suave); line-height:1.4; }
      button { font:inherit; font-weight:600; color:#fff; background:var(--acento); border:0;
        border-radius:10px; padding:12px 24px; min-height:44px; cursor:pointer; }
      @media (prefers-color-scheme: dark) { button { color:#131817; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Sin conexión. Tus gastos se ven cuando vuelva el internet.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
